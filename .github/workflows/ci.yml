name: ShopFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        working-directory: services
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopflow-test-reports
          path: |
            services/**/target/surefire-reports/**
            services/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        working-directory: services
        env:
          DB_USERNAME: shopflow
          DB_PASSWORD: ci-password
          JWT_SECRET: ci-jwt-secret-for-ci-only
          JWT_EXPIRATION: 3600000
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          ADMIN_EMAIL: admin@shopflow.local
          ADMIN_PASSWORD: ci-admin-password
          INTERNAL_API_KEY: ci-internal-api-key
        run: docker compose config

      - name: Build User Service image
        working-directory: services
        run: docker build -f user-service/Dockerfile -t shopflow/user-service:ci .

      - name: Build Product Service image
        working-directory: services
        run: docker build -f product-service/Dockerfile -t shopflow/product-service:ci .

      - name: Build Order Service image
        working-directory: services
        run: docker build -f order-service/Dockerfile -t shopflow/order-service:ci .

      - name: Build API Gateway image
        working-directory: services
        run: docker build -f api-gateway/Dockerfile -t shopflow/api-gateway:ci .
