spring:
  application:
    name: order-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_ORDER_GROUP:shopflow-order-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      isolation-level: read_committed
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/shopflow_orders}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${ORDER_SERVICE_PORT:8083}
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}
    issuer: shopflow
  internal:
    api-key: ${INTERNAL_API_KEY:}
  services:
    product-url: ${PRODUCT_SERVICE_URL:http://product-service:8082}
    connect-timeout: PT2S
    read-timeout: PT5S
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.shopflow: INFO
